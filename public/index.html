<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <title>김대원 & 이준우의 코드 공유 사이트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="홈으로 이동">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>김대원 &amp; 이준우의 코드 공유 사이트</span>
      </a>
      <div class="top-actions">
        <span id="shareTag" class="share-tag" hidden></span>
        <button id="logoutBtn" class="button button-quiet" type="button" hidden>로그아웃</button>
      </div>
    </header>

    <main class="main">
      <section class="editor-card" aria-label="코드 편집기">
        <div class="toolbar">
          <div class="language-group">
            <span class="language-label">언어</span>
            <div id="languagePicker" class="language-picker">
              <button id="languageTrigger" class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span id="languageTriggerText" class="language-trigger-text">자동 인식</span>
                <span id="recognizedBadge" class="recognized-badge" hidden>인식됨</span>
                <svg class="chevron-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div id="languageMenu" class="language-menu" hidden>
                <div class="language-search-wrap">
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    <path d="m12.4 12.4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                  <input id="languageSearch" type="search" autocomplete="off" placeholder="언어 검색" aria-label="언어 검색">
                </div>
                <div id="languageOptions" class="language-options" role="listbox" aria-label="코드 언어"></div>
              </div>
            </div>
          </div>

          <div class="toolbar-actions">
            <button id="copyBtn" class="button button-quiet" type="button">코드 복사</button>
            <button id="messageShareBtn" class="button button-quiet" type="button">문자로 공유하기</button>
            <button id="shareBtn" class="button button-primary" type="button">공유 링크 만들기</button>
          </div>
        </div>

        <textarea id="editor" aria-label="코드 입력"></textarea>

        <div class="editor-footer">
          <span id="codeStats">0자 · 1줄</span>
          <div class="footer-status">
            <span id="draftState">자동 임시저장</span>
            <span id="accessState"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="shareDialog" class="share-dialog">
    <form method="dialog" class="dialog-card" id="shareForm">
      <div class="dialog-heading">
        <div>
          <h2>공유 링크 만들기</h2>
          <p>공유 링크를 열 때 필요한 권한을 선택하세요.</p>
        </div>
        <button class="icon-button" value="cancel" aria-label="닫기" type="submit">×</button>
      </div>

      <label class="field-label" for="shareVisibility">공유 링크 열기</label>
      <select id="shareVisibility" class="dialog-select">
        <option value="protected" selected>비밀번호 입력</option>
        <option value="public">비밀번호 없이 보기</option>
      </select>

      <div id="shareResult" class="share-result" hidden>
        <label class="field-label" for="shareUrl">공유 주소</label>
        <div class="share-url-row">
          <input id="shareUrl" type="text" readonly>
          <button id="copyShareUrlBtn" class="button button-quiet" type="button">복사</button>
        </div>
      </div>

      <p id="shareError" class="dialog-error" role="alert"></p>

      <div class="dialog-actions">
        <button class="button button-quiet" value="cancel" type="submit">취소</button>
        <button id="createShareBtn" class="button button-primary" type="button">만들기</button>
      </div>
    </form>
  </dialog>

  <dialog id="messageGuideDialog" class="fade-dialog compact-dialog">
    <div class="dialog-card">
      <div class="dialog-heading compact-heading">
        <div>
          <h2>문자로 공유하기</h2>
          <p>파일을 메시지로 보내기 전에 확인해 주세요.</p>
        </div>
      </div>
      <p class="guide-copy">내용이 없거나 깨진 png로 다운로드 됩니다. 메시지로 공유한 후 상대방이 확장자를 png에서 txt로 변경하라고 알려주세요. 휴대폰으로 공유를 클릭해 전송도 가능합니다.</p>
      <div class="dialog-actions">
        <button id="guideConfirmBtn" class="button button-quiet" type="button">확인</button>
        <button id="guideShareBtn" class="button button-primary" type="button">공유</button>
      </div>
    </div>
  </dialog>

  <dialog id="messageShareDialog" class="fade-dialog compact-dialog">
    <div class="dialog-card">
      <div class="dialog-heading compact-heading">
        <div>
          <h2>문자로 공유하기</h2>
          <p>현재 코드를 .png 파일로 준비합니다.</p>
        </div>
        <button id="messageInfoBtn" class="info-icon-button" type="button" aria-label="문자로 공유하기 안내 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 10.8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7.4" r="1.1" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="file-preview-row">
        <div class="file-type">PNG</div>
        <div class="file-preview-text">
          <strong id="messageFileName">code.png</strong>
          <span>상대방이 받은 뒤 확장자를 .txt로 변경</span>
        </div>
      </div>
      <div class="dialog-actions wrap-actions">
        <button id="messageCloseBtn" class="button button-quiet" type="button">닫기</button>
        <button id="messageDownloadBtn" class="button button-quiet" type="button">PNG 다운로드</button>
        <button id="deviceShareBtn" class="button button-primary" type="button">휴대폰으로 공유</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/display/placeholder.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/mode/loadmode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/xml/xml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/javascript/javascript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/css/css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/htmlmixed/htmlmixed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/clike/clike.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.2/build/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
